# Local development only. Security is disabled and the port is bound to loopback.
# Do not expose this service publicly. Hosted clusters use ELASTICSEARCH_NODE and
# ELASTICSEARCH_API_KEY from backend/.env, which is not committed.
name: iskolarmatch

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: iskolarmatch-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      cluster.name: iskolarmatch-local
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - iskolarmatch-elasticsearch:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  iskolarmatch-elasticsearch:
